name: Foundational starter assets

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/foundational-starter-assets.yml'
      - '00-shell-linux/**'
      - '00-git/**'
      - 'scripts/check_repo.sh'
      - 'scripts/README.md'
  push:
    branches: [main]
    paths:
      - '.github/workflows/foundational-starter-assets.yml'
      - '00-shell-linux/**'
      - '00-git/**'
      - 'scripts/check_repo.sh'
      - 'scripts/README.md'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate foundational starter assets
        run: |
          bash scripts/check_repo.sh foundational
name: Repository structure validation

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/repository-structure.yml'
      - '**/README.md'
      - '**/PROGRESS.md'
      - 'structure.txt'
      - '16-cloud-databases/**'
      - 'scripts/check_repo.sh'
      - 'scripts/create_module.sh'
  push:
    branches: [main]
    paths:
      - '.github/workflows/repository-structure.yml'
      - '**/README.md'
      - '**/PROGRESS.md'
      - 'structure.txt'
      - '16-cloud-databases/**'
      - 'scripts/check_repo.sh'
      - 'scripts/create_module.sh'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate repository structure
        run: |
          bash scripts/check_repo.sh structure
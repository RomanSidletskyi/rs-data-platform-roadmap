services:
  minio:
    image: ${MINIO_IMAGE}
    container_name: homelab-minio-hadoop
    command: server /data --console-address ":${MINIO_CONSOLE_PORT}"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "${MINIO_API_PORT}:9000"
      - "${MINIO_CONSOLE_PORT}:9001"
    volumes:
      - minio-data:/data

  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until (/usr/bin/mc alias set local http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD}) do sleep 2; done;
      /usr/bin/mc mb --ignore-existing local/${MINIO_BUCKET};
      exit 0;
      "

  spark:
    image: ${SPARK_IMAGE}
    container_name: homelab-spark-hadoop
    depends_on:
      - minio
      - minio-init
    environment:
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      AWS_REGION: us-east-1
    working_dir: /opt/spark/work-dir
    command: ["/bin/bash", "-lc", "sleep infinity"]
    volumes:
      - ../config/spark-defaults.conf.template:/opt/bitnami/spark/conf/spark-defaults.conf:ro

volumes:
  minio-data:
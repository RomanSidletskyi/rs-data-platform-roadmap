version: 2

sources:
  - name: raw
    description: Files loaded as delivered by core/20_load.sql. One row per file for Coinbase, one row per CSV line for FRED.
    database: P09_MARKETS
    schema: RAW
    tables:
      - name: coinbase_candles_raw
        description: One API response per row, with its request window and fetch time.
        config:
          loaded_at_field: LOADED_AT
          freshness:
            warn_after: {count: 2, period: hour}
            error_after: {count: 6, period: hour}
      - name: fred_observations_raw
        description: One CSV line per row; the series id comes from the file path.
        config:
          loaded_at_field: LOADED_AT
          freshness:
            warn_after: {count: 3, period: day}
            error_after: {count: 7, period: day}
